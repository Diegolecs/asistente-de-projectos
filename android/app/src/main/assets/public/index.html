    <script>
      // Gracefully ignore Vite WebSocket connection logs in preview iframe per environment constraints
      (function() {
        const origError = console.error;
        const origWarn = console.warn;
        function isVite(arg) {
          if (!arg) return false;
          if (arg === '[vite]') return true;
          try {
            const s = typeof arg === 'string' ? arg : (arg.message || String(arg));
            return s.includes('[vite]');
          } catch {
            return false;
          }
        }
        console.error = function(...args) {
          if (args.some(isVite)) return;
          origError.apply(console, args);
        };
        console.warn = function(...args) {
          if (args.some(isVite)) return;
          origWarn.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(e) {
          if (isVite(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(e) {
          if (isVite(e.message) || isVite(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
      })();
    </script>
