<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="112" fill="#090d16" />
  <defs>
    <linearGradient id="brandGrad" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="160" y1="160" x2="352" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <!-- Geometric OS / Project icon elements -->
  <rect x="100" y="100" width="312" height="312" rx="48" fill="url(#brandGrad)" />
  <rect x="144" y="144" width="224" height="224" rx="28" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" />
  <!-- Minimalist layout lines representing projects, milestones and tasks -->
  <line x1="184" y1="200" x2="328" y2="200" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="184" y1="256" x2="280" y2="256" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="184" y1="312" x2="240" y2="312" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-opacity="0.6" />
  <circle cx="320" cy="312" r="14" fill="#38bdf8" />
</svg>
